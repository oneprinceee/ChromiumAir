name: Build ChromiumAir (Windows x64)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        default: 'v155.0.8059.39-air'
      upload_release:
        description: 'Publish assets to GitHub Releases'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-chromiumair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build ChromiumAir Windows x64 (AVX2)
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      PYTHONIOENCODING: 'utf-8'
      CHROMIUM_VERSION: '155.0.8059.39'

    steps:
      - name: Checkout ChromiumAir Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Disk Space on Runner
        shell: pwsh
        run: |
          Write-Host "Freeing runner storage for Chromium build..."
          $dirsToClean = @(
            "C:\Android",
            "C:\vcpkg",
            "C:\hostedtoolcache\windows\Java",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\Go"
          )
          foreach ($dir in $dirsToClean) {
            if (Test-Path $dir) {
              Write-Host "Removing $dir..."
              Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{Name="FreeGB";Expression={[math]::round($_.Free/1GB,2)}}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httplib2 clang packaging unidiff

      - name: Set up depot_tools
        shell: pwsh
        run: |
          Write-Host "Cloning depot_tools..."
          $depotPath = "$env:USERPROFILE\depot_tools"
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $depotPath
          $depotPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "Fetching prebuilt gn.exe and ninja.exe..."
          python -c @"
          import urllib.request, zipfile, io, os

          depot = os.path.expanduser('~/depot_tools')
          headers = {'User-Agent': 'Mozilla/5.0'}

          # Fetch gn.exe
          req = urllib.request.Request('https://chrome-infra-packages.appspot.com/dl/gn/gn/windows-amd64/+/latest', headers=headers)
          with urllib.request.urlopen(req) as resp:
              with zipfile.ZipFile(io.BytesIO(resp.read())) as z:
                  z.extract('gn.exe', depot)
          print('Extracted gn.exe to', depot)

          # Fetch ninja.exe
          req = urllib.request.Request('https://chrome-infra-packages.appspot.com/dl/infra/3pp/tools/ninja/windows-amd64/+/latest', headers=headers)
          with urllib.request.urlopen(req) as resp:
              with zipfile.ZipFile(io.BytesIO(resp.read())) as z:
                  z.extract('ninja.exe', depot)
          print('Extracted ninja.exe to', depot)
          "@

      - name: Retrieve Sources (Chromium 155 & uBlock Origin)
        shell: pwsh
        run: |
          mkdir -p download_cache
          Write-Host "Retrieving official Chromium source archive..."
          python utils/downloads.py retrieve -i downloads.ini -c download_cache
          Write-Host "Retrieving uBlock Origin dependency..."
          python utils/downloads.py retrieve -i deps.ini -c download_cache

      - name: Unpack Sources
        shell: pwsh
        run: |
          Write-Host "Unpacking Chromium sources into chromium_src..."
          python utils/downloads.py unpack -i downloads.ini -c download_cache chromium_src

          Write-Host "Unpacking uBlock Origin into chromium_src/third_party/ublock..."
          New-Item -ItemType Directory -Path "ublock_temp" -Force | Out-Null
          Expand-Archive -Path "download_cache\ublock-origin-1.75.0.zip" -DestinationPath "ublock_temp" -Force
          if (Test-Path "ublock_temp\uBlock0.chromium") {
            Move-Item -Path "ublock_temp\uBlock0.chromium" -Destination "chromium_src\third_party\ublock" -Force
          } else {
            Move-Item -Path "ublock_temp" -Destination "chromium_src\third_party\ublock" -Force
          }
          Remove-Item -Path "ublock_temp" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Pre-activate uBlock User Lists
        shell: pwsh
        run: |
          Write-Host "Configuring uBlock user lists (RU AdList, Cookie notices, Annoyances, AdGuard)..."
          python -c @"
          import json, os
          target = os.path.join('chromium_src', 'third_party', 'ublock', 'assets', 'assets.json')
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              lists = ['RUS-0', 'easylist-cookies', 'easylist-annoyances', 'ublock-annoyances', 'adguard-tracking-protection', 'easylist-newsletters', 'easylist-notifications']
              for k in lists:
                  if k in data and isinstance(data[k], dict):
                      data[k]['off'] = False
                      print(f'Activated list: {k}')
              with open(target, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
              print('uBlock assets.json successfully updated!')
          else:
              print('Warning: assets.json not found')
          "@

      - name: Prune Google Binaries
        shell: pwsh
        run: |
          Write-Host "Pruning pre-built binaries..."
          python utils/prune_binaries.py chromium_src pruning.list

      - name: Apply ChromiumAir Patches
        shell: pwsh
        run: |
          Write-Host "Applying ChromiumAir patch series..."
          python utils/patches.py apply chromium_src patches

      - name: Fetch Clang and Rust Toolchains
        shell: pwsh
        run: |
          Write-Host "Fetching LLVM/Clang compiler toolchain..."
          python chromium_src/tools/clang/scripts/update.py
          Write-Host "Fetching Rust toolchain..."
          python chromium_src/tools/rust/update_rust.py
          
          Write-Host "Ensuring clang-format binary is mapped to buildtools/win-format..."
          New-Item -ItemType Directory -Path "chromium_src/buildtools/win-format" -Force | Out-Null
          $cfSrc = "chromium_src/third_party/llvm-build/Release+Asserts/bin/clang-format.exe"
          $cfDst = "chromium_src/buildtools/win-format/clang-format.exe"
          if (Test-Path $cfSrc) {
            Copy-Item $cfSrc -Destination $cfDst -Force
          } else {
            Write-Host "Fetching clang-format binary from official mirror..."
            Invoke-WebRequest -Uri "https://github.com/angular/clang-format/raw/master/bin/win32/clang-format.exe" -OutFile $cfDst
          }

          Write-Host "Ensuring Node.js binary is available for WebUI compilation in third_party/node/win..."
          New-Item -ItemType Directory -Path "chromium_src/third_party/node/win" -Force | Out-Null
          $nodeDst = "chromium_src/third_party/node/win/node.exe"
          if (-not (Test-Path $nodeDst)) {
            Write-Host "Fetching node.exe (v24.12.0 x64)..."
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.12.0/win-x64/node.exe" -OutFile $nodeDst
          }

          Write-Host "Ensuring TypeScript toolchain (tsc.exe and lib definitions) is available for tsgo in third_party/typescript..."
          $tsLibDir = "chromium_src/third_party/typescript/windows-amd64/src/lib"
          New-Item -ItemType Directory -Path $tsLibDir -Force | Out-Null
          Write-Host "Fetching TypeScript 6.0.2 package from npm..."
          $tsPkg = "$env:TEMP/typescript-6.0.2.tgz"
          if (-not (Test-Path $tsPkg)) {
            Invoke-WebRequest -Uri "https://registry.npmjs.org/typescript/-/typescript-6.0.2.tgz" -OutFile $tsPkg
          }
          $tsExtract = "$env:TEMP/ts_extract"
          New-Item -ItemType Directory -Path $tsExtract -Force | Out-Null
          tar -xzf $tsPkg -C $tsExtract
          Copy-Item "$tsExtract/package/lib/*" -Destination $tsLibDir -Recurse -Force
          # Ensure Node treats tsc.js as CommonJS instead of inheriting root package.json "type": "module"
          '{"type": "commonjs"}' | Set-Content -Path "chromium_src/third_party/typescript/package.json" -Encoding ascii

          Write-Host "Compiling native tsc.exe wrapper for Windows..."
          $csSource = (Resolve-Path "utils/tsc_wrapper.cs").Path
          $csTarget = "$((Resolve-Path $tsLibDir).Path)\tsc.exe"
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:"$csTarget" "$csSource"
          & "$csTarget" --version

          Write-Host "Ensuring esbuild.exe is available for DevTools bundling..."
          $esbuildDir = "chromium_src/third_party/devtools-frontend/src/third_party/esbuild"
          New-Item -ItemType Directory -Path $esbuildDir -Force | Out-Null
          $esbuildDst = "$esbuildDir/esbuild.exe"
          if (-not (Test-Path $esbuildDst)) {
            Write-Host "Fetching esbuild binary from npm @esbuild/win32-x64..."
            $esbuildPkg = "$env:TEMP/esbuild.tgz"
            Invoke-WebRequest -Uri "https://registry.npmjs.org/@esbuild/win32-x64/-/win32-x64-0.28.2.tgz" -OutFile $esbuildPkg
            $esExtract = "$env:TEMP/esbuild_extract"
            New-Item -ItemType Directory -Path $esExtract -Force | Out-Null
            tar -xzf $esbuildPkg -C $esExtract
            Copy-Item "$esExtract/package/esbuild.exe" -Destination $esbuildDst -Force
            & "$esbuildDst" --version
          }

          Write-Host "Ensuring gperf binary is available for Blink code generation in third_party/gperf/bin..."
          $gperfDir = "chromium_src/third_party/gperf/bin"
          New-Item -ItemType Directory -Path $gperfDir -Force | Out-Null
          $gperfDst = "$gperfDir/gperf.exe"
          if (-not (Test-Path $gperfDst)) {
            Write-Host "Fetching gperf binary from SourceForge mirror..."
            $gperfZip = "$env:TEMP/gperf_pkg.zip"
            curl.exe -f -sSL "https://downloads.sourceforge.net/project/ezwinports/gperf-3.1-w32-bin.zip" -o $gperfZip
            $gpExtract = "$env:TEMP/gperf_extract"
            New-Item -ItemType Directory -Path $gpExtract -Force | Out-Null
            tar.exe -xf $gperfZip -C $gpExtract bin/gperf.exe
            Copy-Item "$gpExtract/bin/gperf.exe" -Destination $gperfDst -Force
            & "$gperfDst" --version
          }

          Write-Host "Ensuring llvm-libclang binaries and Python bindings are available for V8 metagen in third_party/llvm-libclang..."
          $clangBinDir = "chromium_src/third_party/llvm-libclang/bin"
          New-Item -ItemType Directory -Path $clangBinDir -Force | Out-Null
          $libclangSrc = "chromium_src/third_party/llvm-build/Release+Asserts/bin/libclang.dll"
          $libclangDst = "$clangBinDir/libclang.dll"
          if (Test-Path $libclangSrc) {
            Write-Host "Copying libclang.dll from LLVM toolchain..."
            Copy-Item $libclangSrc -Destination $libclangDst -Force
          }
          $clangPyDir = "chromium_src/third_party/llvm-libclang/bindings/python/clang"
          New-Item -ItemType Directory -Path $clangPyDir -Force | Out-Null
          if (-not (Test-Path "$clangPyDir/cindex.py")) {
            Write-Host "Fetching cindex.py and __init__.py from official llvm-project mirror..."
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/llvm/llvm-project/main/clang/bindings/python/clang/cindex.py" -OutFile "$clangPyDir/cindex.py"
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/llvm/llvm-project/main/clang/bindings/python/clang/__init__.py" -OutFile "$clangPyDir/__init__.py"
          }

      - name: Apply Domain Substitution
        shell: pwsh
        run: |
          Write-Host "Applying domain substitutions..."
          New-Item -ItemType Directory -Path "build" -Force | Out-Null
          python utils/domain_substitution.py apply -r domain_regex.list -f domain_substitution.list -c build/domsubcache.tar.gz chromium_src

      - name: Configure GN Build Args
        shell: pwsh
        run: |
          Write-Host "Configuring Windows SDK version..."
          python utils/patch_windows_sdk.py
          Write-Host "Setting up out/Default/args.gn..."
          New-Item -ItemType Directory -Path "chromium_src/out/Default" -Force | Out-Null
          Copy-Item flags.gn -Destination chromium_src/out/Default/args.gn
          Set-Location chromium_src
          & "$env:USERPROFILE\depot_tools\gn.exe" gen out/Default --script-executable=python

      - name: Compile ChromiumAir Targets
        shell: pwsh
        run: |
          Set-Location chromium_src
          Write-Host "Starting compilation of chrome and mini_installer..."
          & "$env:USERPROFILE\depot_tools\ninja.exe" -C out/Default chrome mini_installer

      - name: Package Output Binaries
        shell: pwsh
        run: |
          $outDir = "chromium_src\out\Default"
          $distDir = "dist\ChromiumAir"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          Write-Host "Assembling portable distribution in $distDir..."
          $filesToCopy = @(
            "chrome.exe",
            "chrome.dll",
            "chrome_elf.dll",
            "chrome_100_percent.pak",
            "chrome_200_percent.pak",
            "resources.pak",
            "icudtl.dat",
            "v8_context_snapshot.bin",
            "d3dcompiler_47.dll",
            "dxcompiler.dll",
            "dxil.dll",
            "vk_swiftshader.dll",
            "vk_swiftshader_icd.json",
            "vulkan-1.dll"
          )
          foreach ($file in $filesToCopy) {
            $srcPath = "$outDir\$file"
            if (Test-Path $srcPath) {
              Copy-Item $srcPath -Destination $distDir
            }
          }
          if (Test-Path "$outDir\locales") {
            Copy-Item "$outDir\locales" -Destination "$distDir\locales" -Recurse
          }
          if (Test-Path "$outDir\MEIPreload") {
            Copy-Item "$outDir\MEIPreload" -Destination "$distDir\MEIPreload" -Recurse
          }

          Write-Host "Creating zip package..."
          Compress-Archive -Path "$distDir\*" -DestinationPath "ChromiumAir-Windows-x64-AVX2.zip" -Force

          if (Test-Path "$outDir\mini_installer.exe") {
            Write-Host "Found mini_installer.exe, copying as installer..."
            Copy-Item "$outDir\mini_installer.exe" -Destination "ChromiumAir-Installer-x64-AVX2.exe"
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChromiumAir-Windows-x64-AVX2
          path: |
            ChromiumAir-Windows-x64-AVX2.zip
            ChromiumAir-Installer-x64-AVX2.exe
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.upload_release == true || inputs.upload_release == '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v155.0.8059.39-air' }}
          name: ChromiumAir ${{ inputs.release_tag || 'v155.0.8059.39-air' }} (AVX2/FMA Comet Lake)
          body: |
            ## 🚀 ChromiumAir Release ${{ inputs.release_tag }}
            
            Ultra-fast, stripped-down Chromium build fine-tuned for high refresh displays and modern Intel architectures.

            ### ✨ Key Features Included:
            * **Architecture:** Tailored for **Intel Core i3-10100F (Comet Lake)** and modern x64 CPUs with full **AVX2 + FMA3** acceleration and `-O3` compiler optimization.
            * **Display:** **Native 165 Hz / High Refresh Rates preserved**.
            * **Classic Tabs:** Restored pre-2022 attached trapezoidal tabs (Supermium layout geometry, 30px height, instant zero-IO rendering).
            * **Adblock in Core:** Built-in **uBlock Origin 1.75.0** as a native trusted component with CNAME DNS uncloaking. Preloaded with active Russian & Tracking filter lists.
            * **Extensions:** **Manifest V2 preserved** + Chrome Web Store proxy support for seamless extension downloads.
            * **Privacy:** Private Google search without omnibox tracking, plus Canvas/Audio/Media fingerprinting noise tokens.
            * **Instant Startup:** Disabled telemetry, update nags, first-run wizards, and enabled lazy tab restore.

            ### 📦 Downloads:
            - **`ChromiumAir-Windows-x64-AVX2.zip`**: Portable build (unzip and launch `chrome.exe`).
            - **`ChromiumAir-Installer-x64-AVX2.exe`**: Self-extracting Windows installer.
          files: |
            ChromiumAir-Windows-x64-AVX2.zip
            ChromiumAir-Installer-x64-AVX2.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
